# CatOS init configuration.
#
# One service per line:   <action> <path> [args...]
#   bg       start once in the background; init does not wait for it. Use this
#            for long-running daemons.
#   respawn  start the program and restart it every time it exits, whether it
#            crashed, faulted, was killed, or left cleanly (the shell's "exit"
#            builtin). Use this for the interactive shell and anything else the
#            system is unusable without; a one-shot job belongs under "bg".
#
# Blank lines and lines beginning with '#' are ignored. Paths are absolute or
# resolved from init's working directory ("/").

respawn /bin/sh

bg /bin/desktop
