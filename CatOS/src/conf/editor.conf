# CatOS editor configuration.
#
# One setting per line, "key=value", read once when the editor starts. Blank
# lines and lines beginning with '#' are ignored, as are keys this editor does
# not know - so a file written for a later version still works here.
#
# A value is on or off: "on", "1", "true" and "yes" all mean on, and anything
# else - including a missing file - means off, which is the behaviour the editor
# had before it read this at all.
#
#   linenumbers   draw a line-number gutter down the left-hand side. It takes as
#                 many columns as the file has digits, plus a blank one, so the
#                 text area narrows as the file grows past ten, a hundred, a
#                 thousand lines.
#
#   wrap          break a line too long for the window across as many rows as it
#                 needs, instead of scrolling sideways to follow the cursor.
#                 Up and Down then move by screen row rather than by line, which
#                 is the only reading of them that makes sense once one line can
#                 be several rows; Home and End still go to the ends of the whole
#                 line.

linenumbers=on
wrap=off
